name: Build AKHI Control Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Paper plugin
        working-directory: plugin
        run: gradle --no-daemon clean build
      - name: Build Fabric keybind mod
        working-directory: fabric-mod
        run: gradle --no-daemon clean build
      - name: Publish downloadable JARs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AKHI Control Panel build ${{ github.run_number }}
          target_commitish: main
          make_latest: true
          files: |
            plugin/build/libs/AKHI-Control-Panel-1.0.0.jar
            fabric-mod/build/libs/akhi-control-keybind-1.0.0.jar
